<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            color: #f8fafc;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 2.5rem;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h2 {
            font-size: 2rem;
            margin-bottom: 1.5rem;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hidden { display: none !important; }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        label {
            font-size: 0.9rem;
            color: #94a3b8;
            text-align: left;
        }

        select, input {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 10px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #f8fafc;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s ease;
        }

        select:focus, input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        button {
            width: 100%;
            padding: 0.8rem 1rem;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.2s ease;
        }

        button:hover {
            box-shadow: 0 4px 14px 0 rgba(99, 102, 241, 0.4);
            transform: translateY(-1px);
        }

        button.btn-secondary {
            background: #334155;
            margin-top: 1rem;
        }

        button.btn-secondary:hover {
            background: #475569;
            box-shadow: none;
        }

        .info-card {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
            color: #cbd5e1;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .timer-badge {
            font-weight: bold;
            color: #f59e0b;
        }

        #feedback {
            margin-top: 1rem;
            font-weight: 600;
            font-size: 1.1rem;
            min-height: 1.5rem;
        }

        .status-win { color: #4ade80; }
        .status-loss { color: #f87171; }
        .status-info { color: #38bdf8; }

        .menu-list {
            list-style: none;
            text-align: left;
            margin-bottom: 1.5rem;
        }

        .menu-item {
            padding: 0.8rem 1rem;
            margin-bottom: 0.5rem;
            border-radius: 10px;
            cursor: pointer;
            border: 1px solid #334155;
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        .menu-item:hover {
            background: rgba(99, 102, 241, 0.15);
            border-color: #6366f1;
        }

        .menu-item .key {
            color: #818cf8;
            font-weight: 700;
            margin-right: 0.6rem;
        }

        .subtext {
            color: #94a3b8;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Number Guessing</h2>

        <!-- Main Menu -->
        <div id="setup-section">
            <ul class="menu-list">
                <li class="menu-item" data-difficulty="easy"><span class="key">1.</span>Easy (1-10, 4 attempts, 20s)</li>
                <li class="menu-item" data-difficulty="medium"><span class="key">2.</span>Medium (1-50, 6 attempts, 30s)</li>
                <li class="menu-item" data-difficulty="hard"><span class="key">3.</span>Hard (1-100, 7 attempts, 45s)</li>
                <li class="menu-item" id="exit-item"><span class="key">4.</span>Exit</li>
            </ul>
        </div>

        <!-- Exit Confirmation Screen -->
        <div id="exit-section" class="hidden">
            <h2>Are you sure?</h2>
            <p class="subtext">Do you want to exit the game?</p>
            <button onclick="confirmExit()">Yes, exit</button>
            <button class="btn-secondary" onclick="cancelExit()">No, go back</button>
        </div>

        <!-- Goodbye Screen -->
        <div id="goodbye-section" class="hidden">
            <h2>Thanks for playing!</h2>
            <button class="btn-secondary" onclick="backToMenuFromGoodbye()">Return to menu</button>
        </div>

        <!-- Gameplay Screen -->
        <div id="game-section" class="hidden">
            <div class="info-card">
                <p id="range-info"></p>
                <p id="attempts-info" style="color: #818cf8;"></p>
                <p>Time Left: <span id="timer" class="timer-badge">--</span>s</p>
            </div>
            <div class="form-group" id="input-controls">
                <input type="number" id="guess-input" placeholder="Enter your guess..." />
                <button onclick="sendGuess()">Submit Guess</button>
            </div>
            <p id="feedback"></p>
            <button id="reset-btn" class="btn-secondary hidden" onclick="resetToMenu()">Play Again</button>
        </div>
    </div>

    <script>
    let currentSessionId = "";
    let currentDifficulty = "";
    let timerInterval = null;
    let secondsLeft = 0;

    // ----- Main menu -----
    document.querySelectorAll(".menu-item[data-difficulty]").forEach(item => {
        item.addEventListener("click", () => startGame(item.dataset.difficulty));
    });

    document.getElementById("exit-item").addEventListener("click", () => {
        document.getElementById("setup-section").classList.add("hidden");
        document.getElementById("exit-section").classList.remove("hidden");
    });

    function confirmExit() {
        document.getElementById("exit-section").classList.add("hidden");
        document.getElementById("goodbye-section").classList.remove("hidden");
    }

    function cancelExit() {
        document.getElementById("exit-section").classList.add("hidden");
        document.getElementById("setup-section").classList.remove("hidden");
    }

    function backToMenuFromGoodbye() {
        document.getElementById("goodbye-section").classList.add("hidden");
        document.getElementById("setup-section").classList.remove("hidden");
    }

    // ----- Start game -----
    async function startGame(difficulty) {
        currentDifficulty = difficulty;

        try {
            const response = await fetch('/api/game/start', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(difficulty)
            });

            if (!response.ok) throw new Error("Server error");

            const data = await response.json();
            currentSessionId = data.sessionId;

            document.getElementById("range-info").innerText = `Guess between ${data.min} and ${data.max}`;
            document.getElementById("attempts-info").innerText = `Attempts left: ${data.maxAttempts}`;
            document.getElementById("feedback").innerText = "";
            document.getElementById("guess-input").value = "";

            document.getElementById("setup-section").classList.add("hidden");
            document.getElementById("exit-section").classList.add("hidden");
            document.getElementById("goodbye-section").classList.add("hidden");
            document.getElementById("game-section").classList.remove("hidden");
            document.getElementById("input-controls").classList.remove("hidden");
            document.getElementById("reset-btn").classList.add("hidden");

            secondsLeft = data.timeRemaining;
            document.getElementById("timer").innerText = secondsLeft;
            clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 1000);

        } catch (err) {
            alert("Could not connect to server. Make sure dotnet run is active at http://localhost:5000");
        }
    }

    function updateTimer() {
        secondsLeft--;
        document.getElementById("timer").innerText = secondsLeft;
        if (secondsLeft <= 0) {
            clearInterval(timerInterval);
            endGame("Out of time! You lost.", "status-loss");
        }
    }

    async function sendGuess() {
        const guessInput = document.getElementById("guess-input");
        const guessVal = parseInt(guessInput.value);
        if (isNaN(guessVal)) return;

        const response = await fetch('/api/game/guess', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sessionId: currentSessionId, guess: guessVal })
        });

        const data = await response.json();
        const feedbackEl = document.getElementById("feedback");

        if (data.status === "InGame") {
            feedbackEl.className = "status-info";
            feedbackEl.innerText = `Result: ${data.result}`;
            document.getElementById("attempts-info").innerText = `Attempts left: ${data.attemptsRemaining}`;
        } else if (data.status === "Invalid") {
            feedbackEl.className = "status-loss";
            feedbackEl.innerText = data.message;
        } else if (data.status === "Won") {
            clearInterval(timerInterval);
            endGame(`${data.message} Time taken: ${data.timeTaken}s`, "status-win");
        } else if (data.status === "Lost") {
            clearInterval(timerInterval);
            endGame(`${data.message} The correct number was: ${data.correctNumber}`, "status-loss");
        }
        guessInput.value = "";
    }

    function endGame(message, styleClass) {
        const feedbackEl = document.getElementById("feedback");
        feedbackEl.className = styleClass;
        feedbackEl.innerText = message;
        document.getElementById("input-controls").classList.add("hidden");
        document.getElementById("reset-btn").classList.remove("hidden");
    }

    function resetToMenu() {
        clearInterval(timerInterval);
        document.getElementById("game-section").classList.add("hidden");
        document.getElementById("setup-section").classList.remove("hidden");
    }
</script>
</body>
</html>
